<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Local Collab Settings</title>
  <link rel="stylesheet" href="settings.css">
  <script src="settings.js" defer></script>
</head>
<body>
  <h1>Settings</h1>
  <h2>Local server</h2>
  <p id="server">Checking server…</p>
  <label class="startup"><input id="startup" type="checkbox" disabled> Start the local server when I sign in to Windows</label>
  <p class="hint">Runs quietly in the background so agents can connect before you open the desktop app.</p>
  <p id="status" role="status" aria-live="polite">Checking startup setting…</p>
  <footer><button id="close" type="button">Close</button><button id="save" type="button" disabled>Save</button></footer>
</body>
</html>

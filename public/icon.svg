<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Local Collab: a note-keeping robot with its notepad. The three rows use the
       page's author colors (three distinct authors).
       Rendered to PNG and .ico by assets/make-icons.ps1. -->
  <defs>
    <filter id="blur" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0a1633" flood-opacity="0.35"/>
    </filter>
    <filter id="small" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0a1633" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Notepad -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f4"/>
    </linearGradient>
    <linearGradient id="paperEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2cce0"/>
      <stop offset="1" stop-color="#8d9bba"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#2b55d4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e99ad"/>
      <stop offset="0.35" stop-color="#f7f9fd"/>
      <stop offset="0.7" stop-color="#c6cede"/>
      <stop offset="1" stop-color="#7d889c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3cddf"/>
      <stop offset="1" stop-color="#dbe2ee"/>
    </linearGradient>
    <radialGradient id="beadBlue" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#c3d6ff"/><stop offset="0.45" stop-color="#4a76ee"/><stop offset="1" stop-color="#1c3c9c"/>
    </radialGradient>
    <radialGradient id="beadOrange" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffe0c4"/><stop offset="0.45" stop-color="#f4843f"/><stop offset="1" stop-color="#b24c12"/>
    </radialGradient>
    <radialGradient id="beadGreen" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#c6f7e8"/><stop offset="0.45" stop-color="#22b892"/><stop offset="1" stop-color="#0a6a52"/>
    </radialGradient>

    <!-- Robot -->
    <linearGradient id="shell" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e3e9f4"/>
      <stop offset="1" stop-color="#b3bfd6"/>
    </linearGradient>
    <linearGradient id="shellEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa7c2"/>
      <stop offset="1" stop-color="#6e7c9b"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2447b0"/>
      <stop offset="0.45" stop-color="#5f8cff"/>
      <stop offset="1" stop-color="#2447b0"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22345f"/>
      <stop offset="1" stop-color="#0b1430"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f2fdff"/>
      <stop offset="0.45" stop-color="#5fe1ff"/>
      <stop offset="1" stop-color="#1a9ad8"/>
    </radialGradient>
    <radialGradient id="bulb" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fff1d6"/>
      <stop offset="0.45" stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#d4570f"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e99ad"/><stop offset="0.45" stop-color="#eef2f9"/><stop offset="1" stop-color="#7d889c"/>
    </linearGradient>

    <!-- Pencil -->
    <linearGradient id="pencil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76a"/><stop offset="0.5" stop-color="#ffb627"/><stop offset="1" stop-color="#d98a0b"/>
    </linearGradient>

    <clipPath id="padClip"><rect x="236" y="84" width="226" height="290" rx="34"/></clipPath>
    <clipPath id="visorClip"><rect x="92" y="250" width="228" height="140" rx="62"/></clipPath>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="256" cy="470" rx="190" ry="20" fill="#0a1633" opacity="0.3" filter="url(#blur)"/>

  <!-- Notepad, tilted behind the robot -->
  <g transform="rotate(9 343 241)">
    <g filter="url(#lift)">
      <rect x="236" y="96" width="226" height="290" rx="34" fill="url(#paperEdge)"/>
      <rect x="236" y="84" width="226" height="290" rx="34" fill="url(#paper)"/>
    </g>
    <g clip-path="url(#padClip)">
      <rect x="236" y="84" width="226" height="70" fill="url(#header)"/>
      <rect x="236" y="84" width="226" height="34" fill="url(#gloss)"/>
      <rect x="236" y="154" width="226" height="8" fill="#0a1633" opacity="0.1"/>
    </g>
    <g filter="url(#small)">
      <rect x="296" y="62" width="18" height="48" rx="9" fill="url(#ring)"/>
      <rect x="340" y="62" width="18" height="48" rx="9" fill="url(#ring)"/>
      <rect x="384" y="62" width="18" height="48" rx="9" fill="url(#ring)"/>
    </g>
    <g filter="url(#small)">
      <circle cx="358" cy="196" r="15" fill="url(#beadBlue)"/>
      <circle cx="358" cy="244" r="15" fill="url(#beadOrange)"/>
      <circle cx="358" cy="292" r="15" fill="url(#beadGreen)"/>
    </g>
    <g fill="url(#line)">
      <rect x="382" y="187" width="58" height="18" rx="9"/>
      <rect x="382" y="235" width="58" height="18" rx="9"/>
      <rect x="382" y="283" width="42" height="18" rx="9"/>
    </g>
  </g>

  <g transform="translate(-6 36) scale(0.9)">
  <!-- Robot: antenna -->
  <rect x="198" y="132" width="16" height="70" rx="8" fill="url(#stem)"/>
  <ellipse cx="206" cy="200" rx="34" ry="12" fill="#8d9bba"/>
  <circle cx="206" cy="122" r="26" fill="url(#bulb)" filter="url(#glow)"/>
  <ellipse cx="198" cy="112" rx="9" ry="6" fill="#ffffff" opacity="0.8"/>

  <!-- Robot: ears -->
  <rect x="38" y="272" width="40" height="100" rx="16" fill="url(#ear)" filter="url(#small)"/>
  <rect x="334" y="272" width="40" height="100" rx="16" fill="url(#ear)" filter="url(#small)"/>

  <!-- Robot: head, edge for thickness, then the face shell -->
  <g filter="url(#lift)">
    <rect x="62" y="212" width="288" height="238" rx="92" fill="url(#shellEdge)"/>
    <rect x="62" y="196" width="288" height="238" rx="92" fill="url(#shell)"/>
  </g>
  <ellipse cx="160" cy="226" rx="74" ry="20" fill="#ffffff" opacity="0.75"/>

  <!-- Robot: visor and face -->
  <rect x="92" y="250" width="228" height="140" rx="62" fill="url(#visor)"/>
  <g clip-path="url(#visorClip)">
    <ellipse cx="190" cy="252" rx="130" ry="34" fill="#ffffff" opacity="0.12"/>
  </g>
  <g filter="url(#glow)">
    <ellipse cx="160" cy="312" rx="24" ry="28" fill="url(#eye)"/>
    <ellipse cx="252" cy="312" rx="24" ry="28" fill="url(#eye)"/>
    <path d="M178 354 Q206 374 234 354" fill="none" stroke="#5fe1ff" stroke-width="9" stroke-linecap="round"/>
  </g>
  <ellipse cx="152" cy="300" rx="7" ry="9" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="244" cy="300" rx="7" ry="9" fill="#ffffff" opacity="0.9"/>

  </g>

  <!-- Pencil, writing on the pad -->
  <g transform="rotate(38 418 360)" filter="url(#small)">
    <rect x="380" y="344" width="96" height="30" rx="6" fill="url(#pencil)"/>
    <rect x="466" y="344" width="22" height="30" rx="6" fill="#f08aa0"/>
    <rect x="460" y="344" width="10" height="30" fill="#c6cede"/>
    <path d="M380 344 L352 359 L380 374 Z" fill="#f3d3a6"/>
    <path d="M362 353.6 L352 359 L362 364.4 Z" fill="#3a3f4b"/>
  </g>
</svg>
